name: Deploy to dev

# The dev project always mirrors the dev branch: on every push to dev, re-run
# the CI checks and then deploy to the dev project only.
# prod is intentionally absent (it needs its own project and manual approval).
on:
  push:
    branches: [dev]

permissions:
  contents: read

# One deploy at a time; a newer push waits instead of cancelling a deploy
# that is already in flight.
concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy functions, firestore and storage to dev
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: functions
    # Scopes the service account secret to this environment.
    environment: dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - run: npm ci
      # Provisional credential (ADR 0006): a long-lived service account key.
      # Sets GOOGLE_APPLICATION_CREDENTIALS for the Firebase CLI.
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEV }}
      # The functions predeploy hook runs lint and build.
      - run: npx firebase deploy --only functions,firestore,storage --project dev --non-interactive
