name: CI

# Runs on every pull request to dev or main, and is reused by deploy-dev.yml so
# that the dev branch only deploys when the same checks pass.
on:
  pull_request:
    branches: [dev, main]
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    name: Lint, typecheck, build, domain tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:domain

  emulators:
    name: Rules and integration tests (emulators)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # The Firestore emulator needs a JVM.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: firebase-emulators-${{ runner.os }}-
      - run: npm ci
      # Both scripts start and stop the emulators themselves (emulators:exec)
      # against demo-* projects, so they never touch a real Firebase project.
      - run: npm run test:rules
      - run: npm run test:integration
